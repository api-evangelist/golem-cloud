specification: FinOps Framework
specificationVersion: '1.0'
schema: https://www.finops.org/framework/
provider: Golem
providerId: golem-cloud
created: '2026-06-20'
modified: '2026-06-20'
reconciled: false
tags:
- Durable Computing
- Serverless
- WebAssembly
- Workers
- Agents
- FinOps
- Cost Management
- FOCUS
description: >-
  FinOps view of Golem spend. There are two distinct cost models. Self-hosted
  open-source Golem carries no license fee - cost is entirely the underlying
  infrastructure (compute, storage, network) you operate it on, governed by
  your own cloud provider's FinOps practices. The managed Golem Cloud hosted
  service is in a free Developer Preview; announced usage-based GA pricing is
  expected to bill on concurrently active agents and workflows, but published
  rates were not available, so hosted spend is not reconciled here.
notes: >-
  Hosted Golem Cloud GA pricing is announced but not yet publicly rated; this
  artifact is not reconciled. For self-hosted Golem, apply standard
  infrastructure FinOps to the compute and storage running the runtime.
sources:
- https://www.golem.cloud/pricing
- https://www.golem.cloud/post/golem-goes-open-source
- https://github.com/golemcloud/golem
