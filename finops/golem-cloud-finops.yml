alignedWith:
  framework: FinOps Foundation Framework
  frameworkUrl: https://www.finops.org/framework/
  dataSpec: FOCUS
  dataSpecVersion: '1.3'
  dataSpecUrl: https://focus.finops.org/focus-specification/v1-3/
publisherName: Golem
serviceCategory: Compute
billingModel:
  pricingCategory: Usage-Based
  billingFrequency: Monthly
  billingCurrency: USD
  chargeCategories:
  - Usage
  - Purchase
  - Adjustment
focusColumns:
  ServiceName: Golem Cloud
  ServiceCategory: Compute
  ProviderName: Golem
  PublisherName: Golem
  InvoiceIssuerName: Golem
  BillingCurrency: USD
  ChargeCategory: Usage
  PricingCategory: Usage-Based
meters:
- name: active_agents
  description: Concurrently active durable workers/agents on the hosted service (announced GA billing basis).
  unit: active_units
  aggregation: max
  dimensions:
  - account
  - environment
- name: active_workflows
  description: Concurrently active workflows on the hosted service (announced GA billing basis).
  unit: active_units
  aggregation: max
  dimensions:
  - account
  - environment
- name: invocations
  description: Worker invocations (invoke and invoke-and-await) executed.
  unit: invocations
  aggregation: sum
  dimensions:
  - account
  - component
- name: component_storage
  description: Storage consumed by uploaded WebAssembly component revisions.
  unit: bytes
  aggregation: max
  dimensions:
  - account
  - environment
- name: self_hosted_infrastructure
  description: Underlying compute and storage cost of running self-hosted open-source Golem (no Golem license fee).
  unit: hours
  aggregation: sum
  dimensions:
  - cluster
  - service
principles:
- name: Visibility
  description: For hosted, track active agents/workflows in the Golem Cloud console; for self-hosted, attribute the runtime's cloud infrastructure spend.
- name: Allocation
  description: Tag components and environments per workload/team; map self-hosted clusters to internal cost centers.
- name: Optimization
  description: Self-host the open-source runtime to avoid hosted fees where control is preferred; interrupt or delete idle workers; right-size the self-hosted cluster.
- name: Accountability
  description: Assign owners per environment/application; review active-agent counts and infrastructure burn monthly against budget.
maintainers:
